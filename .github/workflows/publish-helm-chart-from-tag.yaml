#
# See publish-helm-chart/action.yml for the expected tag format, and the
# details on how the chart is packaged and published
#

name: Publish a Helm Chart based on tags

on:
  workflow_call:
    inputs:
      chart-dir:
        description: "The directory within the source tree where the chart's directory is to be found"
        required: false
        default: "."
        type: string
      public-dir:
        description: "The directory within the public branch where the root of the public contents are found"
        required: false
        default: "."
        type: string
      doc-dir:
        description: "The directory within the source tree where the publishable documentation is to be found"
        required: false
        default: "."
        type: string
      helm-repo-url:
        description: "The URL with which to update the repository index on publishing (generally auto-computed)"
        required: false
        default: ""
        type: string
      publisher-name:
        description: "The username to record with the publishing commit to the public branch"
        required: false
        default: ""
        type: string
      publisher-email:
        description: "The email to record with the publishing commit to the public branch"
        required: false
        default: ""
        type: string

    secrets:
      RELEASE_WORKFLOW_PAT:
        required: true

jobs:
  publish-helm-chart:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the Helm chart
        uses: arkcase/github-action-templates/publish-helm-chart@main
        with:
          chart-dir: ${{ inputs.chart-dir }}
          public-dir: ${{ inputs.public-dir }}
          doc-dir: ${{ inputs.doc-dir }}
          helm-repo-url: ${{ inputs.helm-repo-url }}
          publisher-name: ${{ inputs.publisher-name }}
          publisher-email: ${{ inputs.publisher-email }}
          token: ${{ secrets.RELEASE_WORKFLOW_PAT }}
